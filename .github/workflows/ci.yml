name: ci

on:
  pull_request:
    # `labeled` lets the full-ci label start macOS on a Dependabot pull request.
    types: [opened, synchronize, reopened, labeled]
    # Stacked PRs target the M00/M01 branch as well as main.
    branches: [main, cursor/m00-m01-glassfin-core-bd57]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    # Xcode 27's compiler is Swift 6.4. The tag is pinned to the OCI index for
    # swift:6.4 (Swift 6.4.1). linux/amd64 manifest: sha256:4ce725174432bd37b2aca74776445a79d6bb57b3e95d0800df0af66d5a0c1c33
    container: swift:6.4@sha256:6fbd5978b56a5a9ff05a48f8f678079fc45be496ecda15b4e74e8944fab857be
    timeout-minutes: 10
    outputs:
      macos: ${{ steps.filter.outputs.macos }}
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - name: Install git, Python, and SwiftLint
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git curl unzip ca-certificates python3
          curl -fsSL -o /tmp/swiftlint.zip \
            https://github.com/realm/SwiftLint/releases/download/0.65.1/swiftlint_linux_amd64.zip
          echo "caeed6f4a679c35539ffaf124f6c4ab4a8416917f7d8796279dc52b74026059d  /tmp/swiftlint.zip" | sha256sum -c -
          unzip -o /tmp/swiftlint.zip -d /tmp/swiftlint
          install -m 755 /tmp/swiftlint/swiftlint-static /usr/local/bin/swiftlint
          swift --version
          swiftlint version
          swift-format --version
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - id: filter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: python3 scripts/ci-path-filter.py
      - name: Restore Linux SwiftPM cache
        id: spm-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/org.swift.swiftpm
            Packages/GlassfinCore/.build
          key: linux-spm-${{ hashFiles('Packages/GlassfinCore/Package.resolved') }}
          restore-keys: linux-spm-
      - name: SwiftLint
        run: swiftlint lint --quiet
      - name: swift-format
        run: >
          swift-format lint --recursive --strict
          Packages/GlassfinCore/Package.swift
          Packages/GlassfinCore/Sources
          Packages/GlassfinCore/Tests
          Apps
      - name: license-check
        run: |
          bash scripts/license-check.sh --self-test
          bash scripts/license-check.sh
      - name: Source greps
        run: bash scripts/ci-grep.sh
      - name: Entitlements
        run: bash scripts/check-entitlements.sh
      - name: Debug-only strings
        run: |
          python3 scripts/check-debug-only-strings.py --self-test
          python3 scripts/check-debug-only-strings.py
      - name: Unit-test targets
        run: |
          python3 scripts/check-unit-test-targets.py --self-test
          python3 scripts/check-unit-test-targets.py
      - name: Artifact redaction self-test
        run: python3 scripts/redact_artifacts.py --self-test
      - name: Bootstrap and HLS probe unit tests and shell syntax
        # The tests use unittest enterContext, which needs Python 3.11+.
        run: |
          python3 -c 'import sys; print(sys.version); assert sys.version_info >= (3, 11)'
          python3 -m unittest scripts/test_jellyfin_bootstrap.py
          python3 -m unittest scripts/test_probe_hls_segment_auth.py
          python3 -m unittest discover -s scripts/ci -p 'test_*.py'
          bash -n scripts/docker-integration.sh scripts/generate-playback-media.sh
          bash -n scripts/ci/generate-jellyfin-e2e-media.sh
          bash scripts/docker-integration.sh --self-test
      - name: Linux package tests and coverage gate
        run: bash scripts/coverage-gate.sh
      # Fork pull requests and manual runs may restore, but cannot save caches.
      - name: Save Linux SwiftPM cache
        if: >
          steps.spm-cache.outputs.cache-hit != 'true' &&
          (
            (github.event_name == 'pull_request' &&
             github.event.pull_request.head.repo.full_name == github.repository) ||
            (github.event_name == 'push' && github.ref == 'refs/heads/main')
          )
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/org.swift.swiftpm
            Packages/GlassfinCore/.build
          key: ${{ steps.spm-cache.outputs.cache-primary-key }}

  test-tvos:
    needs: lint
    # Push, including a merge commit on main, stays on lint.
    # Dependabot skips macOS until the full-ci label or workflow_dispatch.
    if: >
      needs.lint.result == 'success' &&
      (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') &&
      (needs.lint.outputs.macos == 'true' || github.event_name == 'workflow_dispatch') &&
      (
        github.event.pull_request.user.login != 'dependabot[bot]' ||
        github.event_name == 'workflow_dispatch' ||
        contains(github.event.pull_request.labels.*.name, 'full-ci')
      )
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - name: Swift version
        run: xcrun swift --version
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: SwiftPM cache environment
        id: spm-environment
        run: |
          if [[ -n "${ImageOS:-}" && -n "${ImageVersion:-}" ]]; then
            xcode_version="$(xcodebuild -version | tr '\n' '-' | tr ' ' '_')"
            echo "version=${ImageOS}-${ImageVersion}-${xcode_version}" >> "$GITHUB_OUTPUT"
          else
            echo "Runner image metadata is unavailable; skipping the SwiftPM cache."
          fi
      - name: Restore SwiftPM SourcePackages
        id: spm-cache
        if: steps.spm-environment.outputs.version != ''
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          # Dependencies only; DerivedData and compiled products stay fresh.
          path: |
            ${{ github.workspace }}/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ steps.spm-environment.outputs.version }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-${{ steps.spm-environment.outputs.version }}-
      - name: Test and Release binary check
        run: bash scripts/macos-ci.sh tvOS
      # Fork pull requests and manual runs may restore, but cannot save caches.
      - name: Save SwiftPM SourcePackages
        if: >
          steps.spm-environment.outputs.version != '' &&
          steps.spm-cache.outputs.cache-hit != 'true' &&
          (
            (github.event_name == 'pull_request' &&
             github.event.pull_request.head.repo.full_name == github.repository) ||
            (github.event_name == 'push' && github.ref == 'refs/heads/main')
          )
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ github.workspace }}/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ steps.spm-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: tvos-results
          # xcresult bundles are not redacted. Upload the text export only.
          path: |
            artifacts/tvOS/readable/**
            artifacts/tvOS/*.log
            artifacts/tvOS/*.txt
          retention-days: 7

  test-ios:
    needs: lint
    if: >
      needs.lint.result == 'success' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'pull_request' && needs.lint.outputs.ios == 'true')
      ) &&
      (
        github.event.pull_request.user.login != 'dependabot[bot]' ||
        github.event_name == 'workflow_dispatch' ||
        contains(github.event.pull_request.labels.*.name, 'full-ci')
      )
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: SwiftPM cache environment
        id: spm-environment
        run: |
          if [[ -n "${ImageOS:-}" && -n "${ImageVersion:-}" ]]; then
            xcode_version="$(xcodebuild -version | tr '\n' '-' | tr ' ' '_')"
            echo "version=${ImageOS}-${ImageVersion}-${xcode_version}" >> "$GITHUB_OUTPUT"
          else
            echo "Runner image metadata is unavailable; skipping the SwiftPM cache."
          fi
      - name: Restore SwiftPM SourcePackages
        id: spm-cache
        if: steps.spm-environment.outputs.version != ''
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          # Dependencies only; DerivedData and compiled products stay fresh.
          path: |
            ${{ github.workspace }}/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ steps.spm-environment.outputs.version }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-${{ steps.spm-environment.outputs.version }}-
      - name: Test and Release binary check
        run: bash scripts/macos-ci.sh iOS
      # Fork pull requests and manual runs may restore, but cannot save caches.
      - name: Save SwiftPM SourcePackages
        if: >
          steps.spm-environment.outputs.version != '' &&
          steps.spm-cache.outputs.cache-hit != 'true' &&
          (
            (github.event_name == 'pull_request' &&
             github.event.pull_request.head.repo.full_name == github.repository) ||
            (github.event_name == 'push' && github.ref == 'refs/heads/main')
          )
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ github.workspace }}/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ steps.spm-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ios-results
          path: |
            artifacts/iOS/readable/**
            artifacts/iOS/*.log
            artifacts/iOS/*.txt
          retention-days: 7

  full-ui:
    needs: lint
    if: >
      needs.lint.result == 'success' &&
      needs.lint.outputs.macos == 'true' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'pull_request' &&
          contains(github.event.pull_request.labels.*.name, 'full-ci')
        )
      )
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: SwiftPM cache environment
        id: spm-environment
        run: |
          if [[ -n "${ImageOS:-}" && -n "${ImageVersion:-}" ]]; then
            xcode_version="$(xcodebuild -version | tr '\n' '-' | tr ' ' '_')"
            echo "version=${ImageOS}-${ImageVersion}-${xcode_version}" >> "$GITHUB_OUTPUT"
          else
            echo "Runner image metadata is unavailable; skipping the SwiftPM cache."
          fi
      - name: Restore SwiftPM SourcePackages
        id: spm-cache
        if: steps.spm-environment.outputs.version != ''
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          # Dependencies only; DerivedData and compiled products stay fresh.
          path: |
            ${{ github.workspace }}/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ steps.spm-environment.outputs.version }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-${{ steps.spm-environment.outputs.version }}-
      - name: Full UI suite
        run: bash scripts/macos-ci.sh tvOS
      # Fork pull requests and manual runs may restore, but cannot save caches.
      - name: Save SwiftPM SourcePackages
        if: >
          steps.spm-environment.outputs.version != '' &&
          steps.spm-cache.outputs.cache-hit != 'true' &&
          (
            (github.event_name == 'pull_request' &&
             github.event.pull_request.head.repo.full_name == github.repository) ||
            (github.event_name == 'push' && github.ref == 'refs/heads/main')
          )
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ github.workspace }}/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ steps.spm-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: full-ui-results
          path: |
            artifacts/tvOS/readable/**
            artifacts/tvOS/*.log
            artifacts/tvOS/*.txt
          retention-days: 7

  jellyfin-e2e:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'full-ci'))
    runs-on: xcode-27
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install SHA-256 verified Jellyfin and ffmpeg
        timeout-minutes: 3
        run: python3 scripts/ci/jellyfin-e2e.py install
      - name: Start fresh loopback-only Jellyfin
        timeout-minutes: 2
        run: python3 scripts/ci/jellyfin-e2e.py start
      - name: Complete wizard, generate media and verify scan
        timeout-minutes: 2
        run: python3 scripts/ci/jellyfin-e2e.py bootstrap
      - name: Run tvOS F3 and F4 acceptance tests when available
        timeout-minutes: 30
        run: python3 scripts/ci/jellyfin-e2e.py test
      - name: Always stop server, remove private state and check logs for leaks
        id: cleanup
        if: always()
        timeout-minutes: 2
        run: python3 scripts/ci/jellyfin-e2e.py cleanup
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && steps.cleanup.outputs.safe == 'true'
        with:
          name: jellyfin-e2e-logs
          path: artifacts/jellyfin-e2e/*.json
          if-no-files-found: error
          retention-days: 7

  # After lint succeeds, report even when macOS jobs were skipped or failed.
  # Dependabot requires full-ci and every path-selected macOS job to pass.
  # Use the PR author: a maintainer may be the actor on a labeled event.
  dependabot-macos:
    needs: [lint, test-tvos, test-ios]
    if: always() && needs.lint.result == 'success'
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Require successful macOS results for selected paths
        env:
          EVENT: ${{ github.event_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          FULL_CI: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
          TVOS_REQUIRED: ${{ needs.lint.outputs.macos }}
          IOS_REQUIRED: ${{ needs.lint.outputs.ios }}
          TVOS: ${{ needs.test-tvos.result }}
          IOS: ${{ needs.test-ios.result }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" != "pull_request" || "$PR_AUTHOR" != "dependabot[bot]" ]]; then
            echo "Dependabot macOS gate applies only to Dependabot pull requests."
            exit 0
          fi
          if [[ "$FULL_CI" != "true" ]]; then
            echo "::error::Maintainers must add the full-ci label to this Dependabot pull request before merging."
            exit 1
          fi
          require_result() {
            local job="$1" required="$2" result="$3"
            echo "$job: $result (selected by path filter: $required)" | tee -a "$GITHUB_STEP_SUMMARY"
            case "$required:$result" in
              true:success|false:success|false:skipped) ;;
              *)
                echo "::error::$job did not satisfy the macOS path filter."
                exit 1
                ;;
            esac
          }
          require_result test-tvos "$TVOS_REQUIRED" "$TVOS"
          require_result test-ios "$IOS_REQUIRED" "$IOS"
