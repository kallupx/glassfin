name: integration

# Live Jellyfin matrix. workflow_dispatch only, so pull requests do not start containers.
# Run locally with scripts/docker-integration.sh. Credentials are generated per run.
on:
  workflow_dispatch:
    inputs:
      versions:
        description: Space-separated server versions (empty runs all pinned versions)
        required: false
        default: ''
        type: string
      probe_args:
        description: HLS probe flags (empty is report-only; e.g. --expect-segment-auth kept)
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: HLS segment auth probe, T01-20, and T01-30
        env:
          GLASSFIN_SERVER_VERSIONS: ${{ inputs.versions }}
          GLASSFIN_HLS_PROBE_ARGS: ${{ inputs.probe_args }}
        run: |
          versions=()
          read -r -a versions <<< "$GLASSFIN_SERVER_VERSIONS"
          bash scripts/docker-integration.sh "${versions[@]}"
