name: integration

# Live Jellyfin matrix. workflow_dispatch only, so pull requests do not start containers.
# Run locally with scripts/docker-integration.sh. Credentials are generated per run.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: T01-20 and T01-30
        run: bash scripts/docker-integration.sh
