name: integration

# Live Jellyfin matrix. workflow_dispatch only, so pull requests do not start containers.
# Run locally with scripts/docker-integration.sh. Credentials are generated per run.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: T01-20 and T01-30
        run: bash scripts/docker-integration.sh
