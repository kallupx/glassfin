name: release

# TestFlight upload is a stub. Never trigger this from pull_request.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  testflight:
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 10
    steps:
      - name: Write App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          umask 077
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
      - name: Upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: echo "TestFlight upload is not implemented yet."
      - name: Delete App Store Connect key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
