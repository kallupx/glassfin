version: 2
# No auto-merge. Dependabot pull requests fail the gate until full-ci is added.
# Every path-selected macOS job must succeed; no selected paths means no build.
updates:
  - package-ecosystem: swift
    directory: /Packages/GlassfinCore
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      swift-packages:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - "*"
