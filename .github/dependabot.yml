version: 2
# No auto-merge. A grouped dependency pull request stays red until macOS has run.
updates:
  - package-ecosystem: swift
    directory: /Packages/GlassfinCore
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      swift-packages:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - "*"
