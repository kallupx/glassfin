included:
  - Packages
  - Apps
excluded:
  - Packages/GlassfinCore/.build
  - spec
# print(, debugPrint(, dump(, and NSLog( are enforced by scripts/check-forbidden-calls.py.
# SwiftLint custom_rules need SourceKit and do not run on the Linux lint job.
only_rules:
  - force_cast
  - force_try
analyzer_rules: []
reporter: emoji
