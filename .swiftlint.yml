included:
  - Packages
  - Apps
excluded:
  - Packages/GlassfinCore/.build
  - spec
only_rules:
  - force_cast
  - force_try
  - custom_rules
custom_rules:
  no_print:
    name: No print
    regex: '\bprint\('
    message: Use GlassfinLog instead of print
    severity: error
analyzer_rules: []
reporter: emoji
